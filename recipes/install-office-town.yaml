version: "1.0.0"
title: Install Office Town
description: >
  Stand up a complete Office Town box — provision the Cloudflare worker and all
  its bindings, wire Goose + the sync daemon + the apps onto this Mac, install
  OfficeCLI, and seed the cortex. The supported installer (the Cloudflare deploy
  button does not work for this repo). Run from the office-town-cloud repo root.

author:
  contact: jezweb

parameters:
  - key: account_id
    input_type: string
    requirement: required
    description: >
      Target Cloudflare account id. For a client box this is usually a fresh
      account the client owns. Must be on Workers Paid (Containers + Browser
      Rendering). CLOUDFLARE_API_TOKEN must be exported in the environment.

  - key: pack
    input_type: string
    requirement: optional
    default: "ask"
    description: >
      Industry pack to seed: trades | professional-services | creative |
      web-agency | bookings-services. "ask" = decide with the human from the
      business type.

  - key: with_sync
    input_type: string
    requirement: optional
    default: "true"
    description: >
      "true" installs the officetowd daemon + a local ~/OfficeTown/ folder.
      "false" = AI-access-only box (no local cortex folder).

  - key: business_name
    input_type: string
    requirement: optional
    default: ""
    description: The business this box is for — used to seed the org entity + voice.

extensions:
  - type: builtin
    name: developer

prompt: |
  Install Office Town on this Mac. Follow the `setup-office-town` skill
  (skills/setup-office-town/SKILL.md in this repo) end to end — it's the
  procedure. Clone the repo first if you're not already in it.

  This run's inputs:
  - Cloudflare account id: {{ account_id }}  (CLOUDFLARE_API_TOKEN is in the env)
  - Industry pack to seed: {{ pack }}  (if "ask", choose with the human)
  - Local sync daemon + folder: {{ with_sync }}  (if "false", pass WITHOUT_SYNC=1 to connect.sh)
  - Business name: {{ business_name }}

  Use your judgement for the box you're on — adapt to what's actually installed
  and report what you find rather than assuming. Verify by exercising the tools
  at the end, not by trusting that a step printed success. And treat anything
  irreversible or account-level (which account, spending money, connector
  consent) as a checkpoint with the human.
