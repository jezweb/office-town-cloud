name: boss-delegation-contact-filing
description: Boss delegates contact-filing to the right role and asks clarifying questions
working_dir: buildings/office
prompt: "@boss I want to add a new contact for Jane Smith at acme.com — what should I do? Don't actually do it, just tell me who would handle this and how."
max_turns: 4
expected_patterns:
  must_contain:
    - ["delegate", "hand", "route"]
    - ["@", "the worker", "the librarian"]  # references a target role
    - ["?", "where", "which", "what"]  # asks clarifying question
  must_not_contain:
    - "I'll do it myself"
    - "let me file this contact"  # boss shouldn't do the work
notes: |
  Currently expects worker delegation (no wiki MCP wired yet — boss correctly
  falls back to "worker handles general data entry").

  After M3 (wiki MCP wired):
  - Expected delegation target should shift to LIBRARIAN
    (filing contacts = extraction + curation, librarian's room)
  - This test should be updated to expect "@librarian" specifically
  - The boss's reasoning should reference wiki.write() or similar

  This is a deliberate regression-detection point: when the wiki MCP lands,
  this test changes expected behaviour. Re-run after M3.
verified: 2026-05-26
revisit_after: M3
