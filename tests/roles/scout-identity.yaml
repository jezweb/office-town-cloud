name: scout-identity
description: Scout identifies role + lookout + outward-looking purpose + boundary awareness
working_dir: buildings/lookout
prompt: "@scout who are you, what building is this, and what's your job? answer briefly."
max_turns: 4
expected_patterns:
  must_contain:
    - ["scout", "Scout"]
    - ["lookout", "Lookout"]
    - ["outward", "outside", "environment", "industry", "world", "horizon"]
  must_not_contain:
    - "I cannot"
    - "Post Office"
expected_persona_markers:
  - "curious"
  - "ambiguity"
  - "patterns"
  - "what's that"
  - "looking out"
  - "scan"
verified: 2026-05-26
boundary_check:
  description: Scout should mention what it does NOT do (fix, curate, route)
  must_contain:
    - ["don't fix", "doesn't fix", "not for fixing", "not Workshop"]
    - ["don't curate", "doesn't curate", "not Library"]
