name: librarian-empty-state
description: When the wiki is empty, librarian suggests concrete starting points
working_dir: buildings/library
prompt: "@librarian what should I do first to get started?"
max_turns: 4
expected_patterns:
  must_contain:
    - ["empty", "no entries", "no wiki", "stocked", "bare"]
    - ["extract", "pull", "harvest", "from email", "from web"]
    - ["?", "would you", "what would you", "do you want"]  # asks user for direction
  must_not_contain:
    - "I cannot help"
    - "I don't know what to do"
notes: |
  This test was verified manually in the M1 dogfood (2026-05-26). The librarian
  noticed the empty library state and suggested concrete starting points
  (extract contacts from email, scrape a website, file documents).
verified: 2026-05-26
