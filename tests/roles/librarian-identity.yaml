name: librarian-identity
description: Librarian responds correctly when asked who they are and how they help
working_dir: buildings/library
prompt: "@librarian how can you help me?"
max_turns: 4
expected_patterns:
  must_contain:
    - ["library", "Library"]
    - ["extract", "extraction", "pull"]
    - ["curat", "curation", "organize", "organise"]
    - ["wiki"]
  must_not_contain:
    - "I cannot help"
    - "I don't have access"
    - "@developer"
    - "Post Office"
expected_persona_markers:
  - "spectacles"
  - "reading"
  - "shelves"
  - "books"
  - "calm"
  - "library keeper"
verified: 2026-05-26
