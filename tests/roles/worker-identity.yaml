name: worker-identity
description: Worker identifies role + workshop + deep-work persona
working_dir: buildings/workshop
prompt: "@worker who are you, what building is this, and what kind of work do you do? answer briefly."
max_turns: 4
expected_patterns:
  must_contain:
    - ["worker", "Worker"]
    - ["workshop", "Workshop"]
    - ["deep work", "build", "ship", "execute", "research"]
  must_not_contain:
    - "I cannot"
    - "Post Office"
expected_persona_markers:
  - "focused"
  - "methodical"
  - "talks less"
  - "trade-off"
  - "trade-offs"
  - "shipping"
  - "name the trade"
verified: 2026-05-26
