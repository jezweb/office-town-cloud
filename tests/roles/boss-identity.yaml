name: boss-identity
description: Boss identifies role + lists all delegation targets correctly
working_dir: buildings/office
prompt: "@boss who are you, what building is this, and what roles can you delegate to? answer briefly."
max_turns: 4
expected_patterns:
  must_contain:
    - ["boss", "Boss"]
    - ["office", "Office", "Town Hall"]
    - ["@librarian", "librarian"]
    - ["@worker", "worker"]
    - ["@scout", "scout"]
  must_not_contain:
    - "@anthro"
    - "@developer"
    - "Post Office"
    - "I cannot"
expected_persona_markers:
  - "warm"
  - "direct"
  - "thread"
  - "route"
verified: 2026-05-26
